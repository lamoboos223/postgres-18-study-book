<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 620" role="img" aria-labelledby="title desc">
  <title id="title">PostgreSQL object hierarchy</title>
  <desc id="desc">A PostgreSQL server instance manages one cluster. The cluster contains databases. A database contains schemas. A schema contains tables and indexes. Tables contain rows stored in pages.</desc>
  <rect width="880" height="620" fill="#fffdf7"/>
  <g font-family="Sora, Segoe UI, sans-serif">
    <rect x="40" y="28" width="800" height="70" rx="14" fill="#1d3f5c"/>
    <text x="440" y="58" text-anchor="middle" fill="#fff" font-size="22" font-weight="700">PostgreSQL server process (postgres)</text>
    <text x="440" y="82" text-anchor="middle" fill="#c5d8e7" font-size="14">one running instance · one postmaster/supervisor</text>

    <rect x="70" y="122" width="740" height="70" rx="14" fill="#2f6288"/>
    <text x="440" y="152" text-anchor="middle" fill="#fff" font-size="20" font-weight="700">Database cluster = one data directory (PGDATA)</text>
    <text x="440" y="176" text-anchor="middle" fill="#d5e6f3" font-size="14">roles, WAL, postgresql.conf, all databases together</text>

    <rect x="100" y="216" width="220" height="86" rx="12" fill="#e4eef5" stroke="#2f6288"/>
    <text x="210" y="252" text-anchor="middle" fill="#1d3f5c" font-size="16" font-weight="700">postgres</text>
    <text x="210" y="276" text-anchor="middle" fill="#5b6675" font-size="13">default utility DB</text>

    <rect x="330" y="216" width="220" height="86" rx="12" fill="#e4eef5" stroke="#2f6288"/>
    <text x="440" y="252" text-anchor="middle" fill="#1d3f5c" font-size="16" font-weight="700">template0 / template1</text>
    <text x="440" y="276" text-anchor="middle" fill="#5b6675" font-size="13">not for application work</text>

    <rect x="560" y="216" width="220" height="86" rx="12" fill="#fff4dd" stroke="#9a5b00"/>
    <text x="670" y="252" text-anchor="middle" fill="#9a5b00" font-size="16" font-weight="700">study_lab</text>
    <text x="670" y="276" text-anchor="middle" fill="#5b6675" font-size="13">our application database</text>

    <rect x="250" y="326" width="380" height="64" rx="12" fill="#e7f7f5" stroke="#0f6e68"/>
    <text x="440" y="365" text-anchor="middle" fill="#0f6e68" font-size="18" font-weight="700">schema  app   ·   ops   ·   audit</text>

    <rect x="160" y="414" width="250" height="64" rx="12" fill="#e8eef3" stroke="#3a5368"/>
    <text x="285" y="453" text-anchor="middle" fill="#1d3f5c" font-size="17" font-weight="700">table  users / orders</text>

    <rect x="470" y="414" width="250" height="64" rx="12" fill="#e8eef3" stroke="#3a5368"/>
    <text x="595" y="453" text-anchor="middle" fill="#1d3f5c" font-size="17" font-weight="700">index  on those tables</text>

    <rect x="250" y="502" width="380" height="64" rx="12" fill="#fdecec" stroke="#9b1c1c"/>
    <text x="440" y="541" text-anchor="middle" fill="#9b1c1c" font-size="17" font-weight="700">rows stored in 8 kB pages</text>
  </g>
</svg>
